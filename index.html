<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1.0">
<title>家庭日程</title>
<style>
body{font-family:system-ui, sans-serif;max‑width:600px;margin:20px auto;padding:0 16px;}
.box{margin:16px 0;}
input{width:100%;padding:10px;margin:6px 0;box‑sizing:border‑box;font‑size:16px;}
button{padding:10px 18px;font‑size:16px;margin:4px;background:#2563eb;color:white;border:none;border‑radius:4px;cursor:pointer;}
.item{padding:10px;background:#f3f4f6;margin:8px 0;border‑radius:4px;display:flex;justify‑content:space‑between;align‑items:center;}
.del{background:#dc2626;}
</style>
</head>
<body>
<h1>新增日程</h1>
<div class="box">
<input id="title" placeholder="標題">
<input id="date" placeholder="日期">
<input id="note" placeholder="備註">
<button onclick="saveItem()">儲存日程</button>
</div>

<h2>我的日程</h2>
<div id="list"></div>

<script>
let arr=JSON.parse(localStorage.getItem("schedule"))||[];

function render(){
  const div=document.getElementById("list");
  div.innerHTML="";
  arr.forEach((it,i)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`<div><b>${it.title}</b>｜${it.date}<br>${it.note||""}</div>
    <button class="del" onclick="del(${i})">刪除</button>`;
    div.appendChild(d);
  })
}

function saveItem(){
  const title=document.getElementById("title").value.trim();
  const date=document.getElementById("date").value.trim();
  const note=document.getElementById("note").value.trim();
  if(!title){alert("請輸入標題");return;}
  arr.push({title,date,note});
  localStorage.setItem("schedule",JSON.stringify(arr));
  document.getElementById("title").value="";
  document.getElementById("date").value="";
  document.getElementById("note").value="";
  render();
}

function del(idx){
  arr.splice(idx,1);
  localStorage.setItem("schedule",JSON.stringify(arr));
  render();
}

render();
</script>
</body>
</html>
